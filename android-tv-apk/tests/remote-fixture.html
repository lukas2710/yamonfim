<!doctype html>
<html lang="fr">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification navigation TV</title>
<style>
body{background:#0a0a0b;color:white;font:20px Arial;margin:40px}h1{font-size:32px}button,input,[role=button]{box-sizing:border-box;background:#202027;color:white;border:1px solid #ffffff30;border-radius:12px;padding:25px;font-size:20px;min-width:180px;text-align:center}input{width:100%;max-width:620px;text-align:left}.grid{display:grid;grid-template-columns:repeat(3,200px);gap:30px;margin:30px 0}dialog{padding:35px;background:#18181d;color:white;border:1px solid #f87171;border-radius:15px}dialog button{margin:15px}.spacer{height:800px}.row{display:flex;gap:30px;width:620px;overflow-x:auto;padding:10px}button:disabled{opacity:.25}
</style>
<h1>Navigation TV · contrôle local</h1><p>Utilise les flèches et Entrée.</p>
<div class="grid">
<button id="a">Film A</button><button id="b">Film B</button><button disabled id="disabled">Indisponible</button>
<div role="button" tabindex="0" id="c" onkeydown="if(event.key==='Enter')this.textContent='Série ouverte'">Série C</div><button id="d">Film D</button><button id="open" onclick="document.getElementById('modal').showModal()">Ouvrir VIP</button>
</div>
<label for="search">Recherche</label><br><input id="search" type="text" value="Star Wars">
<div class="spacer"></div><button id="lower">Plus bas</button>
<dialog id="modal" role="dialog" aria-modal="true"><h2>Quota atteint</h2><button id="vip">Offre VIP</button><button id="close" aria-label="Fermer" onclick="document.getElementById('modal').close()">Fermer</button></dialog>
<script src="../app/src/main/assets/tv-navigation.js"></script>
</html>
